[package]
name = "flutter-watcher"
version = "0.2.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
notify = "6.1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
